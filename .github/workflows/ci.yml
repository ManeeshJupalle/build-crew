name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: pytest -q

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: install.ps1 on Windows PowerShell 5.1
        run: pytest -q tests/test_install_ps1.py
        env:
          BUILD_CREW_PS: powershell
      - name: install.ps1 on PowerShell 7
        run: pytest -q tests/test_install_ps1.py
        env:
          BUILD_CREW_PS: pwsh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh hooks/session_start.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
