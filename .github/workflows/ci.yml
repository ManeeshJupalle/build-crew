name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: pytest
        run: |
          set +e +o pipefail   # Actions runs bash with -eo pipefail; we want to report, then fail
          pytest -q -rs -p no:cacheprovider --tb=line > pytest.log 2>&1
          status=$?
          cat pytest.log
          # surface failures as annotations (readable without downloading logs)
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit "$status"

  windows-powershell:
    # Windows PowerShell 5.1 (what most Windows users have), not just pwsh 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install.ps1 into a temp home
        shell: powershell
        run: |
          $env:BUILD_CREW_HOME = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force $env:BUILD_CREW_HOME | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $s = Get-Content (Join-Path $env:BUILD_CREW_HOME ".claude\settings.json") -Raw | ConvertFrom-Json
          $guard = $s.hooks.PreToolUse[0].hooks[0]
          if (-not (Test-Path $guard.args[0])) { throw "guard hook path missing: $($guard.args[0])" }
          '{"tool_name":"Bash","tool_input":{"command":"git push --force"}}' | & $guard.command $guard.args[0]
          if ($LASTEXITCODE -ne 2) { throw "guard did not block force push (exit $LASTEXITCODE)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh scripts/py

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
